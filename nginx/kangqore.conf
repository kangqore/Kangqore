# ─── Kangqore Production Nginx ────────────────────────────────────────────────
#
# Routing table:
#   /kangqore-view/*  →  kangqore-view SPA  (admin OS + portals — all roles)
#   /assets/*         →  kangqore-view static assets (Vite, cache-forever)
#   /socket.io/*      →  backend            (WebSocket upgrade)
#   /*                →  backend            (API routes + legacy CRA frontend)
#
# In Docker Compose the backend service is "core-backend" on port 3000.
# For bare-metal / non-Docker, replace with: server 127.0.0.1:5050;

upstream backend {
    server core-backend:3000;
    keepalive 32;
}

# ── HTTP ── redirect all traffic to HTTPS once a certificate is in place ──────
# Uncomment this block and the HTTPS server block below after running certbot.
#
# server {
#     listen 80;
#     server_name kangqore.com www.kangqore.com;
#     return 301 https://$host$request_uri;
# }

server {
    listen 80;
    server_name _;   # Replace with: kangqore.com www.kangqore.com

    # ── Compression ───────────────────────────────────────────────────────────
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml
        application/json application/javascript text/javascript
        application/xml+rss image/svg+xml;
    gzip_vary on;

    # ── Dashboard OS — Vite hash-named assets (safe to cache forever) ─────────
    #
    # Vite builds to /assets/*.js — CRA builds to /static/js/*.js — no clash.
    location /assets/ {
        root /var/www/kangqore-view;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Kangqore OS (/kangqore-view/*) — admin OS + portals ──────────────────
    #
    # All authenticated routes (/kangqore-view/admin/*, /kangqore-view/client/*,
    # /kangqore-view/partner/*, /kangqore-view/investor/*, /kangqore-view/careers/*,
    # /kangqore-view/journalist/*, /kangqore-view/analyst/*) are served here.
    # React Router handles role-gating internally.
    location /kangqore-view/ {
        root /var/www/kangqore-view;
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }

    # ── WebSocket upgrade (Socket.io) ─────────────────────────────────────────
    location /socket.io/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_read_timeout 3600s;
    }

    # ── Everything else → backend (API + legacy CRA frontend) ─────────────────
    location / {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }
}

