# ─── Kangqore Production Nginx ────────────────────────────────────────────────
#
# Routing table:
#   /kangqore-view/*  →  kangqore-view SPA  (admin OS + portals — all roles)
#   /assets/*         →  kangqore-view static assets (Vite, cache-forever)
#   /socket.io/*      →  backend            (WebSocket upgrade)
#   /*                →  backend            (API routes + legacy CRA frontend)
#
# In Docker Compose the backend service is "core-backend" on port 3000.

upstream backend {
    server core-backend:3000;
    keepalive 32;
}

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
server {
    listen 80;
    server_name kangqore.com www.kangqore.com;
    return 301 https://$host$request_uri;
}

# ── HTTPS ─────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name kangqore.com www.kangqore.com;

    ssl_certificate     /etc/letsencrypt/live/kangqore.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kangqore.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling        on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    nosniff                                always;
    add_header X-Frame-Options           SAMEORIGIN                             always;

    # ── Compression ───────────────────────────────────────────────────────────
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml
        application/json application/javascript text/javascript
        application/xml+rss image/svg+xml;
    gzip_vary on;

    # ── Dashboard OS — Vite hash-named assets (cache forever) ─────────────────
    location /assets/ {
        root /var/www/kangqore-view;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Kangqore OS (/kangqore-view/*) ────────────────────────────────────────
    location /kangqore-view/ {
        root /var/www/kangqore-view;
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }

    # ── WebSocket upgrade (Socket.io) ─────────────────────────────────────────
    location /socket.io/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_read_timeout 3600s;
    }

    # ── Everything else → backend ──────────────────────────────────────────────
    location / {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }
}
