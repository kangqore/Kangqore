[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kangqore-view-sdk"
version = "1.0.0"
description = "Official Python SDK for the Kangqore View developer platform — governed actions, ontology, agents, and UI widgets."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Kangqore" }]
keywords = ["kangqore", "sdk", "ontology", "agents", "automation", "governance"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://developers.kangqoreview.com"
Documentation = "https://developers.kangqoreview.com/docs"
Repository = "https://github.com/kangqore/Kangqore"
Issues = "https://github.com/kangqore/Kangqore/issues"

[tool.hatch.build.targets.wheel]
packages = ["kangqore_view"]
