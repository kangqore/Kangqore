version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: pgvector/pgvector:pg15
    container_name: kangqore-postgres
    environment:
      POSTGRES_DB: kangqore_core
      POSTGRES_USER: kangqore_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kangqore_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - kangqore-network

  # Redis for eQORE BullMQ
  redis:
    image: redis:7-alpine
    container_name: kangqore-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - kangqore-network

  # Node.js Core Backend
  core-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: kangqore-core-backend
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://kangqore_user:${POSTGRES_PASSWORD:-kangqore_password}@postgres:5432/kangqore_core
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      REDIS_URL: redis://kangqore-redis:6379
      PYTHON_SERVICE_URL: http://intelligence-layer:8000
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:80,http://localhost,http://localhost:3000}
      FRONTEND_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      KIMMP_MLX_SERVER_URL: ${KIMMP_MLX_SERVER_URL:-http://host.docker.internal:11435}
      KIMMP_MLX_MODEL: ${KIMMP_MLX_MODEL:-/Users/maheshkumar/models/kimmp-reason-v1}
      KIMMP_OLLAMA_URL: ${KIMMP_OLLAMA_URL:-http://host.docker.internal:11434}
      KIMMP_LOCAL_REASON_MODEL: ${KIMMP_LOCAL_REASON_MODEL:-kimmp-reason:latest}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      SERPER_API_KEY: ${SERPER_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      KIMMP_SCOUT_CADENCE_TENDERS: ${KIMMP_SCOUT_CADENCE_TENDERS:-60}
      KIMMP_SCOUT_CADENCE_COMPETITORS: ${KIMMP_SCOUT_CADENCE_COMPETITORS:-120}
    ports:
      - "5050:3000"
    depends_on:
      - postgres
      - redis
      - intelligence-layer
    volumes:
      - ./backend/uploads:/app/backend/uploads
    networks:
      - kangqore-network

  # Python Intelligence Layer
  intelligence-layer:
    build:
      context: ./intelligence-layer
      dockerfile: Dockerfile
    container_name: kangqore-intelligence-layer
    environment:
      PORT: 8000
      ENVIRONMENT: production
      CORE_BACKEND_URL: http://core-backend:3000
    ports:
      - "8000:8000"
    networks:
      - kangqore-network

  # Nginx — public entry point
  # Routes /os/* and /portal/* to kangqore-view static files.
  # Proxies everything else (API + legacy frontend) to core-backend.
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: kangqore-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - core-backend
    networks:
      - kangqore-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  kangqore-network:
    driver: bridge
