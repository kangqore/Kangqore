version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: pgvector/pgvector:pg15
    container_name: kangqore-postgres
    environment:
      POSTGRES_DB: kangqore_core
      POSTGRES_USER: kangqore_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kangqore_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - kangqore-network

  # Redis for eQORE BullMQ
  redis:
    image: redis:7-alpine
    container_name: kangqore-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - kangqore-network

  # Node.js Core Backend
  core-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: kangqore-core-backend
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://kangqore_user:${POSTGRES_PASSWORD:-kangqore_password}@postgres:5432/kangqore_core
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      REDIS_URL: redis://kangqore-redis:6379
      PYTHON_SERVICE_URL: http://intelligence-layer:8000
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:80,http://localhost,http://localhost:3000}
      FRONTEND_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      KIMMP_MLX_SERVER_URL: ${KIMMP_MLX_SERVER_URL:-http://host.docker.internal:11435}
      KIMMP_MLX_MODEL: ${KIMMP_MLX_MODEL:-/Users/maheshkumar/models/kimmp-reason-v1}
      KRISNAM_URL: ${KRISNAM_URL:-http://host.docker.internal:11435}
      KRISNAM_MODEL: ${KRISNAM_MODEL:-/Users/maheshkumar/models/Krisnam/gen2-fused}
      KIMMP_OLLAMA_URL: ${KIMMP_OLLAMA_URL:-http://host.docker.internal:11434}
      KIMMP_LOCAL_REASON_MODEL: ${KIMMP_LOCAL_REASON_MODEL:-kimmp-reason:latest}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      SERPER_API_KEY: ${SERPER_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      KIMMP_SCOUT_CADENCE_TENDERS: ${KIMMP_SCOUT_CADENCE_TENDERS:-60}
      KIMMP_SCOUT_CADENCE_COMPETITORS: ${KIMMP_SCOUT_CADENCE_COMPETITORS:-120}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      TEAMS_WEBHOOK_URL: ${TEAMS_WEBHOOK_URL:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_DEFAULT_REPO: ${GITHUB_DEFAULT_REPO:-}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL:-noreply@kangqore.com}
      DEPLOY_WEBHOOK_URL: ${DEPLOY_WEBHOOK_URL:-}
      PAGERDUTY_ROUTING_KEY: ${PAGERDUTY_ROUTING_KEY:-}
    ports:
      - "5050:3000"
    depends_on:
      - postgres
      - redis
      - intelligence-layer
    develop:
      watch:
        - action: sync
          path: ./backend/src
          target: /app/backend/src
        - action: sync
          path: ./backend/tsconfig.json
          target: /app/backend/tsconfig.json
        - action: sync
          path: ./frontend
          target: /app/frontend
          ignore:
            - node_modules
            - build
    command: sh -c "npx prisma generate && npx tsx src/index.ts"
    volumes:
      - ./backend/uploads:/app/backend/uploads
      - ./backend/src:/app/backend/src
      - ./backend/prisma:/app/backend/prisma
      - ./frontend:/app/frontend
      - ./backend/tsconfig.json:/app/backend/tsconfig.json
      - ./backend/package.json:/app/backend/package.json
      - ./backend/package-lock.json:/app/backend/package-lock.json
    networks:
      - kangqore-network

  # Python Intelligence Layer
  intelligence-layer:
    build:
      context: ./intelligence-layer
      dockerfile: Dockerfile
    container_name: kangqore-intelligence-layer
    environment:
      PORT: 8000
      ENVIRONMENT: production
      CORE_BACKEND_URL: http://core-backend:3000
    ports:
      - "8000:8000"
    networks:
      - kangqore-network

  # Nginx — public entry point
  # Routes /os/* and /portal/* to kangqore-view static files.
  # Proxies everything else (API + legacy frontend) to core-backend.
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: kangqore-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - core-backend
    networks:
      - kangqore-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  kangqore-network:
    driver: bridge
