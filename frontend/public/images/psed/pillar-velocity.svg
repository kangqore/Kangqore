<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" fill="none">
  <rect width="400" height="250" fill="#06090f"/>
  <radialGradient id="g6" cx="35%" cy="50%" r="60%">
    <stop offset="0%" stop-color="#F472B6" stop-opacity="0.18"/>
    <stop offset="100%" stop-color="#06090f" stop-opacity="0"/>
  </radialGradient>
  <rect width="400" height="250" fill="url(#g6)"/>
  <!-- Speed lines tapering from left (slow/thin) to right (fast/bright) -->
  <line x1="20" y1="80" x2="290" y2="68" stroke="#F472B6" stroke-opacity="0.08" stroke-width="0.5"/>
  <line x1="20" y1="92" x2="300" y2="82" stroke="#F472B6" stroke-opacity="0.1" stroke-width="0.8"/>
  <line x1="15" y1="105" x2="310" y2="96" stroke="#F472B6" stroke-opacity="0.13" stroke-width="1"/>
  <line x1="10" y1="118" x2="320" y2="110" stroke="#F472B6" stroke-opacity="0.18" stroke-width="1.2"/>
  <line x1="8" y1="125" x2="330" y2="118" stroke="#F472B6" stroke-opacity="0.28" stroke-width="1.5"/>
  <line x1="8" y1="132" x2="330" y2="138" stroke="#F472B6" stroke-opacity="0.28" stroke-width="1.5"/>
  <line x1="10" y1="140" x2="320" y2="148" stroke="#F472B6" stroke-opacity="0.18" stroke-width="1.2"/>
  <line x1="15" y1="153" x2="310" y2="162" stroke="#F472B6" stroke-opacity="0.13" stroke-width="1"/>
  <line x1="20" y1="166" x2="300" y2="176" stroke="#F472B6" stroke-opacity="0.1" stroke-width="0.8"/>
  <line x1="20" y1="178" x2="290" y2="190" stroke="#F472B6" stroke-opacity="0.08" stroke-width="0.5"/>

  <!-- Rocket/arrow shape pointing right -->
  <polygon points="340,125 295,100 305,125 295,150" fill="#F472B6" fill-opacity="0.75"/>
  <polygon points="305,125 295,108 280,125 295,142" fill="#F472B6" fill-opacity="0.3"/>

  <!-- Glow at rocket tip -->
  <circle cx="340" cy="125" r="10" fill="#F472B6" fill-opacity="0.25"/>
  <circle cx="340" cy="125" r="5" fill="#F472B6" fill-opacity="0.6"/>
  <circle cx="340" cy="125" r="18" stroke="#F472B6" stroke-opacity="0.2" stroke-width="1" fill="none"/>

  <!-- Particle trail -->
  <circle cx="255" cy="122" r="2" fill="#F472B6" fill-opacity="0.4"/>
  <circle cx="230" cy="120" r="1.5" fill="#F472B6" fill-opacity="0.3"/>
  <circle cx="205" cy="119" r="1.5" fill="#F472B6" fill-opacity="0.25"/>
  <circle cx="180" cy="118" r="1" fill="#F472B6" fill-opacity="0.2"/>
  <circle cx="265" cy="130" r="1.5" fill="#F472B6" fill-opacity="0.3"/>
  <circle cx="240" cy="132" r="1" fill="#F472B6" fill-opacity="0.2"/>

  <!-- Time markers on left -->
  <rect x="30" y="108" width="22" height="6" rx="3" fill="#F472B6" fill-opacity="0.15" stroke="#F472B6" stroke-opacity="0.25" stroke-width="0.8"/>
  <rect x="30" y="135" width="35" height="6" rx="3" fill="#F472B6" fill-opacity="0.08" stroke="#F472B6" stroke-opacity="0.2" stroke-width="0.8"/>
  <line x1="52" y1="111" x2="62" y2="111" stroke="#F472B6" stroke-opacity="0.2" stroke-width="0.8" stroke-dasharray="2,2"/>
  <line x1="65" y1="138" x2="75" y2="138" stroke="#F472B6" stroke-opacity="0.15" stroke-width="0.8" stroke-dasharray="2,2"/>
</svg>