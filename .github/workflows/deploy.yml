name: Production Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      deploy_configured: ${{ steps.deploy_secrets.outputs.configured }}

    strategy:
      matrix:
        # Node 18 dropped: react-router-dom@7.x requires node>=20.0.0
        node-version: [20.x]

    steps:
    - uses: actions/checkout@v3

    # The deploy job is gated on its secrets actually existing. Without this the
    # job fails on every push to main with "Error: missing server host", which
    # paints main red permanently and trains everyone to ignore CI — hiding real
    # failures. The `secrets` context is NOT available in a job-level `if`
    # (only github/needs/vars/inputs are), so the check is surfaced here as a
    # job output that deploy can read via `needs`.
    #
    # Secrets are passed through env rather than interpolated into the shell:
    # SERVER_SSH_KEY is multi-line and would break a `[ -n "..." ]` test.
    - name: Check whether deploy secrets are configured
      id: deploy_secrets
      env:
        DEPLOY_HOST: ${{ secrets.SERVER_HOST }}
        DEPLOY_USER: ${{ secrets.SERVER_USER }}
        DEPLOY_KEY: ${{ secrets.SERVER_SSH_KEY }}
      run: |
        if [ -n "$DEPLOY_HOST" ] && [ -n "$DEPLOY_USER" ] && [ -n "$DEPLOY_KEY" ]; then
          echo "configured=true" >> "$GITHUB_OUTPUT"
          echo "::notice::Deploy secrets present — deploy job will run on push to main."
        else
          echo "configured=false" >> "$GITHUB_OUTPUT"
          echo "::notice::Deploy job will be skipped — SERVER_HOST, SERVER_USER and SERVER_SSH_KEY are not all set. Add them in Settings > Secrets and variables > Actions to enable deployment."
        fi

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: '**/package-lock.json'

    # Redirect drift gate — fails fast if shared/legacyRedirects.json was edited
    # but the .generated.json mirrors were not regenerated.
    - name: Verify legacy-redirect mirrors are in sync
      run: npm run redirects:check

    # Sitemap drift gate — fails fast if departmentsData.js or servicesData.js
    # changed without regenerating frontend/public/sitemap.xml.
    - name: Verify sitemap.xml matches canonical data
      run: npm run sitemap:check

    # Phase F audit gates — pure static analysis, sub-second each.
    # Each audit script exits non-zero on any failure with a precise reason.
    - name: Audit SEO data completeness (departmentSEO + serviceSEO)
      run: npm run audit:seo-data

    - name: Audit legacy URL coverage (every legacy URL has a valid redirect)
      run: npm run audit:legacy-coverage

    - name: Audit page-source SEO surface (canonical + OG + JSON-LD)
      run: npm run audit:page-seo

    - name: Copy consistency audit (US spelling, labelled numeric claims)
      run: npm run audit:copy-consistency

    - name: Design token audit (type scale, section rhythm)
      run: npm run audit:design-tokens

    # Backend Build
    - name: Install Backend Dependencies
      working-directory: ./backend
      run: npm ci

    - name: Build Backend
      working-directory: ./backend
      run: npm run build

    # Frontend Build
    - name: Install Frontend Dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Build Frontend
      working-directory: ./frontend
      run: npm run build
      env:
        REACT_APP_BACKEND_URL: "" # Relative path for prod
        CI: false # Don't treat warnings as errors

    # Phase C — Legacy 301 redirect smoke tests against the Express middleware.
    # Uses the compiled backend dist (no Docker needed in CI for this layer).
    - name: Run legacy-redirect smoke test (local harness)
      run: npm run test:redirects:local

    # Data architecture invariants (regression guard for 6-dept × N-services canonical structure)
    - name: Run data architecture invariants
      run: node scripts/audit-data-architecture.mjs

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: [build]
    # Skipped (grey) rather than failed (red) until the deploy secrets exist.
    # Nothing to change here once they are added — the gate opens by itself.
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      needs.build.outputs.deploy_configured == 'true'

    steps:
    - name: SSH deploy
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        script: |
          cd ${{ secrets.SERVER_REPO_PATH || '/opt/kangqore' }}
          git pull origin main
          docker compose up --build -d
          docker compose exec -T core-backend npx ts-node --skip-project prisma/seedDepartmentsMarketing.ts || true
          echo "Deploy complete: $(date)"
