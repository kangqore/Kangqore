name: Kangqore View — Smoke Tests

# Runs on PRs that touch kangqore-view code.
# Starts the Vite dev server, injects demo auth, navigates all 23 routes,
# and asserts no white screens or error boundaries.
on:
  pull_request:
    paths:
      - 'kangqore-view/**'
      - '.github/workflows/kangqore-view-e2e.yml'

jobs:
  smoke:
    name: Playwright smoke (23 routes)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: kangqore-view/package-lock.json

      - name: Install dependencies
        working-directory: kangqore-view
        run: npm ci

      - name: Install Playwright browsers
        working-directory: kangqore-view
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        working-directory: kangqore-view
        run: npx playwright test
        env:
          CI: true

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: kangqore-view/playwright-report/
          retention-days: 7
