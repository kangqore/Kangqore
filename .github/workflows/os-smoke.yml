name: Kangqore OS — Smoke Tests

# Runs on PRs that touch the frontend (Kangqore OS).
# Starts the Vite dev server, injects demo auth, navigates all routes,
# and asserts no white screens or error boundaries.
on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/kangqore-view-e2e.yml'

jobs:
  smoke:
    name: Playwright smoke
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        working-directory: frontend
        run: npx playwright test
        env:
          CI: true

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
