name: Kangqore OS — Smoke Tests

# Runs on PRs that touch the frontend (Kangqore OS).
# Builds static production bundle, starts preview server, injects demo auth,
# navigates all routes, and asserts no white screens or error boundaries.
on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/os-smoke.yml'

jobs:
  smoke:
    name: Playwright smoke
    runs-on: ubuntu-latest

    # Without this the job inherits GitHub's 6-hour default. `playwright install
    # --with-deps` shells out to apt-get and can hang indefinitely on a slow or
    # unavailable mirror — which it did on PR #405, sitting in-progress for over
    # three hours and blocking the PR while nothing was wrong with the code.
    # Fail fast instead so a stalled runner is obvious and cheap to re-run.
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        timeout-minutes: 8
        run: npx playwright install --with-deps chromium

      - name: Build frontend static bundle
        working-directory: frontend
        run: npm run build

      - name: Run smoke tests
        working-directory: frontend
        run: npx playwright test
        env:
          CI: true
          DISABLE_API_PROXY: true

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
